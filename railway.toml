[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run db:generate && npm run build:api"

[deploy]
startCommand = "node packages/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
source = "."

[[services]]
name = "worker"
source = "."
startCommand = "node packages/api/dist/worker.js"
