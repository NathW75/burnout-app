name: Deploy gate

# Railway's production services wait for every GitHub check on the commit
# ("wait for CI"). This one fails during the NFL blackout window, which holds
# the production deploy; CI (tests) must pass too. Staging is not gated.
on:
  push:
    branches: [main]

jobs:
  blackout-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Thu 5:00 PM ET → Tue 2:00 AM ET is closed to production deploys
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: scripts/deploy-gate.sh "$(date +%s)" "$COMMIT_MESSAGE"
